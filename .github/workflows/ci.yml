name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --release
      - name: Benchmark
        run: cargo run --release -p ntrader-core --example bench
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Web Trader
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: End-to-end
        run: |
          cargo build --release -p ntrader-server
          ./target/release/ntrader-server config.toml &
          sleep 3
          curl --fail --silent --output /dev/null http://127.0.0.1:8080/
          node tools/smoke.mjs
          npm install --no-save --prefix tools playwright-core
          CHROME=$(which google-chrome) node tools/ui-check.mjs
